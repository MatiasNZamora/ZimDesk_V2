name: CI/CD ZimDesk v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: zimdesk-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/matiasnzamora/zimdesk_v2

jobs:
  test:
    name: Lint + Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build-push:
    name: Build y push a GHCR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tag de imagen
        id: meta
        run: |
          SHA_TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "image=${{ env.IMAGE_NAME }}:${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_DOMAIN=${{ vars.NEXT_PUBLIC_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy a VPS Hostinger
    needs: [test, build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT }}
          command_timeout: 15m
          envs: IMAGE_REF,GHCR_USERNAME,GHCR_TOKEN,NEXTAUTH_URL,NEXTAUTH_SECRET,NEXT_PUBLIC_DOMAIN,DB_PASSWORD,DATABASE_URL,MAIL_HOST,MAIL_PORT,MAIL_USER,MAIL_PASSWORD,MAIL_FROM,MAIL_TICKET_NOTIFICATION,UPLOAD_DIR,MAX_FILE_SIZE_MB,MAX_VIDEO_SIZE_MB,CRON_SECRET,SLA_THRESHOLD_MINUTES
          script: |
            set -euo pipefail
            umask 077

            PROJECT=zimdesk
            CF="-p $PROJECT -f docker-compose.production.yml --env-file .env"
            cd /opt/zimdesk-app

            echo "=== 1/7 Código ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== 2/7 .env ==="
            cat > .env.new <<EOF
            ZIMDESK_IMAGE=${IMAGE_REF}
            NEXTAUTH_URL=${NEXTAUTH_URL}
            NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
            NEXT_PUBLIC_DOMAIN=${NEXT_PUBLIC_DOMAIN}
            DB_PASSWORD=${DB_PASSWORD}
            DATABASE_URL=${DATABASE_URL}
            MAIL_HOST=${MAIL_HOST}
            MAIL_PORT=${MAIL_PORT}
            MAIL_USER=${MAIL_USER}
            MAIL_PASSWORD=${MAIL_PASSWORD}
            MAIL_FROM=${MAIL_FROM}
            MAIL_TICKET_NOTIFICATION=${MAIL_TICKET_NOTIFICATION}
            UPLOAD_DIR=${UPLOAD_DIR}
            MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB}
            MAX_VIDEO_SIZE_MB=${MAX_VIDEO_SIZE_MB}
            CRON_SECRET=${CRON_SECRET}
            SLA_THRESHOLD_MINUTES=${SLA_THRESHOLD_MINUTES}
            EOF
            chmod 600 .env.new && mv .env.new .env

            echo "=== 3/7 Backup de la DB (si ya existe) ==="
            mkdir -p backups
            if docker ps --format '{{.Names}}' | grep -qx zimdesk-db; then
              STAMP=$(date +%F-%H%M%S)
              docker exec zimdesk-db pg_dump -U zimdesk -d zimdesk -Fc > "backups/pre-deploy-${STAMP}.dump"
              ls -1t backups/*.dump 2>/dev/null | tail -n +11 | xargs -r rm -f
            else
              echo "Primer deploy: sin DB previa, se omite backup."
            fi

            echo "=== 4/7 Login GHCR + pull ==="
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose $CF pull app

            echo "=== 5/7 Base de datos ==="
            docker compose $CF up -d --wait --wait-timeout 120 db

            echo "=== 6/7 App (migraciones corren en el entrypoint) ==="
            docker compose $CF up -d --wait --wait-timeout 180 app
            docker compose $CF up -d backup
            docker compose $CF ps

            echo "=== 7/7 Limpieza ==="
            docker image prune -f
            docker logout ghcr.io
        env:
          IMAGE_REF: ${{ needs.build-push.outputs.image }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_DOMAIN: ${{ vars.NEXT_PUBLIC_DOMAIN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_USER: ${{ vars.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TICKET_NOTIFICATION: ${{ vars.MAIL_TICKET_NOTIFICATION }}
          UPLOAD_DIR: ${{ vars.UPLOAD_DIR }}
          MAX_FILE_SIZE_MB: ${{ vars.MAX_FILE_SIZE_MB }}
          MAX_VIDEO_SIZE_MB: ${{ vars.MAX_VIDEO_SIZE_MB }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SLA_THRESHOLD_MINUTES: ${{ vars.SLA_THRESHOLD_MINUTES }}

  verify:
    name: Smoke test externo
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health por HTTPS público
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://${{ vars.NEXT_PUBLIC_DOMAIN }}/api/public/health"; then
              echo; echo "OK"; exit 0
            fi
            echo "intento $i/12..."; sleep 5
          done
          echo "El endpoint público no responde (revisar DNS / NPM / certificado)"
          exit 1
